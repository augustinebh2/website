<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="24" height="24">
  <!-- Hugging Face Official Icon -->
  <g>
    <!-- Head -->
    <ellipse cx="60" cy="56" rx="42" ry="40" fill="#FFD21E"/>
    
    <!-- Cheeks (Blush) -->
    <ellipse cx="32" cy="58" rx="7" ry="5.5" fill="#FFA800" opacity="0.85"/>
    <ellipse cx="88" cy="58" rx="7" ry="5.5" fill="#FFA800" opacity="0.85"/>

    <!-- Left Eye (Happy Arc) -->
    <path d="M 37 46 C 39 40, 47 40, 49 46 C 46 43, 40 43, 37 46 Z" fill="#20232A"/>
    <ellipse cx="43" cy="44" rx="4" ry="4" fill="#20232A"/>

    <!-- Right Eye (Happy Arc) -->
    <path d="M 71 46 C 73 40, 81 40, 83 46 C 80 43, 74 43, 71 46 Z" fill="#20232A"/>
    <ellipse cx="77" cy="44" rx="4" ry="4" fill="#20232A"/>

    <!-- Smile / Open Mouth with Tongue -->
    <path d="M 45 56 C 45 68, 75 68, 75 56 C 75 66, 68 76, 60 76 C 52 76, 45 66, 45 56 Z" fill="#20232A"/>
    <!-- Tongue -->
    <path d="M 52 68 C 55 64, 65 64, 68 68 C 66 73, 54 73, 52 68 Z" fill="#FF385C"/>

    <!-- Left Hugging Hand -->
    <g transform="translate(10, 62) rotate(-18)">
      <path d="M 12 18 C 8 18, 2 24, 0 30 C 0 38, 8 44, 18 44 C 28 44, 34 36, 34 28 C 34 22, 28 18, 22 18 C 22 14, 18 10, 14 10 C 10 10, 8 14, 8 18" fill="#FFD21E" stroke="#E6A700" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Finger grooves -->
      <path d="M 9 19 C 13 23, 16 28, 17 35" stroke="#E6A700" stroke-width="2" stroke-linecap="round"/>
      <path d="M 15 14 C 18 20, 21 26, 22 34" stroke="#E6A700" stroke-width="2" stroke-linecap="round"/>
      <path d="M 22 18 C 23 23, 24 28, 25 33" stroke="#E6A700" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right Hugging Hand -->
    <g transform="translate(110, 62) scale(-1, 1) rotate(-18)">
      <path d="M 12 18 C 8 18, 2 24, 0 30 C 0 38, 8 44, 18 44 C 28 44, 34 36, 34 28 C 34 22, 28 18, 22 18 C 22 14, 18 10, 14 10 C 10 10, 8 14, 8 18" fill="#FFD21E" stroke="#E6A700" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Finger grooves -->
      <path d="M 9 19 C 13 23, 16 28, 17 35" stroke="#E6A700" stroke-width="2" stroke-linecap="round"/>
      <path d="M 15 14 C 18 20, 21 26, 22 34" stroke="#E6A700" stroke-width="2" stroke-linecap="round"/>
      <path d="M 22 18 C 23 23, 24 28, 25 33" stroke="#E6A700" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
