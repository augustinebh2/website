<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Outer Rounded Square Border in Watermark Style -->
    <rect x="6" y="6" width="88" height="88" rx="18" stroke="rgba(255, 255, 255, 0.14)" stroke-width="5.5" fill="none"/>
    <!-- Centered i dot (matching actual logo: perfect circle, properly positioned) -->
    <circle cx="27" cy="25" r="7" fill="rgba(255, 255, 255, 0.14)"/>
    <!-- Centered i stem (wider, matching actual logo proportions) -->
    <rect x="18" y="38" width="18" height="42" fill="rgba(255, 255, 255, 0.14)"/>
    <!-- Centered r stem -->
    <rect x="40" y="38" width="18" height="42" fill="rgba(255, 255, 255, 0.14)"/>
    <!-- Centered r arm arch (refined to match the serif-style curve of the actual logo) -->
    <path d="M58 38 C64 36 70 36 76 36 C80 36 82 38 82 43 L82 52 C82 52 76 52 70 52 C64 52 60 55 58 60 Z" fill="rgba(255, 255, 255, 0.14)"/>
</svg>
